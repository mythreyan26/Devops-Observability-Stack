services:
  # 1. Custom Node.js Express Application
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: observability-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - LOKI_URL=http://loki:3100
      - OTEL_SERVICE_NAME=nodejs-demo-app
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://jaeger:4318/v1/traces
    depends_on:
      - loki
      - jaeger
    restart: unless-stopped

  # 2. Prometheus (Metrics Scraper & Time-Series Database)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    depends_on:
      - app
    restart: unless-stopped

  # 3. Loki (Centralized Log Aggregator)
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  # 4. Jaeger (Distributed Tracing UI & Collector)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4318:4318"   # OTLP HTTP receiver endpoint
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  # 5. Grafana (Unified Dashboard for Metrics, Logs & Traces)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - jaeger
    restart: unless-stopped
